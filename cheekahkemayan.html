<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Cheekah Kemayan Estate - Plantation and Agronomy Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .details-content { display: none; }
        .details-content.active { display: block; }
        .dropdown-btn.active { background-color: #14532d; }
        .policy-item { border-left: 3px solid #16a34a; padding-left: 1rem; margin-top: 0.75rem; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .chart-container { position: relative; height: 300px; width: 100%; margin: auto; }
        .pie-chart-container { position: relative; height: 350px; width: 100%; margin: auto; }
        .observation-ref { font-size: 0.75rem; color: #57534e; font-style: italic; }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <div class="text-xl font-bold text-gray-900">
                <a href="index.html" class="flex items-center">
                    Cheekah Kemayan Estate Report
                </a>
            </div>
            <a href="estates.html" class="text-green-800 hover:text-green-900 transition duration-300">&larr; Back to Estates List</a>
        </nav>
    </header>

    <div class="container mx-auto p-4 md:p-8">
        <div id="selected-estate-container" class="grid grid-cols-1 gap-8">
             <!-- Content will be generated by JavaScript -->
        </div>
    </div>
    
    <div id="policyModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-2xl font-bold">Agricultural Policy Cross-Reference</h3>
                <button onclick="closePolicyModal()" class="text-gray-500 hover:text-gray-800 text-2xl font-bold">&times;</button>
            </div>
            <div id="modalContent" class="space-y-4 overflow-y-auto pr-4 flex-grow">
                <!-- Modal content will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Register DataLabels globally but we will disable it locally on charts that don't need it
            Chart.register(ChartDataLabels);

            const estateData = {
                "id": "cheekahkemayan",
                "name": "Ladang Cheekah Kemayan",
                "reportInfo": "Data based on PA Report 1/2026 (visit on 24th Jun 2026) & Agronomy Report 1/2026 (visit on 30th July 2026).",
                "summaryMetrics": {
                    "area": { 
                        "title": "Estate Area", 
                        "lines": [
                            "Mature: 1,208.76 ha", 
                            "Immature: 334.62 ha", 
                            "Total Planted: 1,543.38 ha",
                            "Next Replant: 2027 (172.2 ha)"
                        ] 
                    },
                    "yield": { 
                        "title": "Yield/Ha (MT)", 
                        "type": "chart", 
                        "canvasId": "miniYieldChart", 
                        "note": "*2026 represents Jan-Jun only." 
                    },
                    "cost": { 
                        "title": "FFB Cost/Tonne", 
                        "value": "RM 266.08 / RM 286.48", 
                        "note": "YTD April 2026 (Var: +7% Fav)" 
                    },
                    "manuring": { 
                        "title": "Manuring Progress", 
                        "value": "50% Completed", 
                        "note": "1st Half 2026 (Delayed)" 
                    },
                    "ganoderma": { 
                        "title": "Ganoderma Status", 
                        "value": "High Incidence", 
                        "note": "No census conducted in 2025/2026" 
                    }
                },
                "keyMetrics": [
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-red-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z' /></svg>`, "label": "Labour Deficit", "value": "-6 Workers (91/97)" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-orange-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z' /></svg>`, "label": "Pests", "value": "Rats (1-4%), Rhino Beetle in PR25B" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-yellow-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M13 10V3L4 14h7v7l9-11h-7z' /></svg>`, "label": "Weeding Status", "value": "Mixed cover, slight improvement" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-purple-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' /></svg>`, "label": "Harvest Interval", "value": "12-18 Days (Acceptable)" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-teal-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z' /></svg>`, "label": "Soil Condition", "value": "High Silt (New drains in P21A/PR25B)" },
                    { "icon": `<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-red-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17.657 18.343A8 8 0 016.343 7.029m11.314 11.314a8 8 0 01-11.314-11.314m2.121 13.435a2 2 0 01-2.828 0l-2.122-2.121a2 2 0 010-2.828l5.656-5.657a2 2 0 012.829 0l2.121 2.121a2 2 0 010 2.828l-5.657 5.657z' /></svg>`, "label": "Palm Age Profile", "value": "Unfavourable (42% >26 yrs)" }
                ],
                "chartData": {
                    "production": {
                        "labels": ["2020", "2021", "2022", "2023", "2024", "2025"],
                        "ffb": [19.63, 14.78, 16.42, 16.63, 17.35, 15.37],
                        "note": "*Historical FFB Yield (MT/Ha) from Agronomy Report 1/2026."
                    },
                    "ageProfile": {
                        "labels": ["0-3 Yrs (Immature)", "4-7 Yrs (Young Mature)", "8-19 Yrs (Prime)", "20-25 Yrs (Old)", ">26 Yrs (Old)"],
                        "data": [21.7, 16.1, 0, 20.4, 42.0],
                        "title": "Cheekah Kemayan Palm Age Profile (% of Area)",
                        "note": "*Source: Agronomy Report 1/2026, Pg. 9. No palms in prime-yielding age."
                    }
                },
                "observations": [
                    "<b>Yield Decline & Age Profile:</b> 2025 FFB yield dropped to 15.37 MT/ha. YTD Jun 2026 sits at 6.93 MT/ha, lower than the same period last year (7.37 MT/ha). The severely unbalanced age profile (42% >26 years old, 0% prime palms) remains a critical bottleneck for production. <span class='observation-ref'>(PA 1/2026 Pg. 34; AR 1/2026 Pg. 8, 51-52)</span>",
                    "<b>Ganoderma Mortality:</b> High incidence of Ganoderma persists, but no census was conducted in 2025 or up to July 2026. Mounding is no longer recommended due to age; strict sanitation and expedited de-boling must be prioritized. <span class='observation-ref'>(PA 1/2026 Pg. 24; AR 1/2026 Pg. 4, 10-11)</span>",
                    "<b>Drainage & Weeding:</b> Subsoils with high silt content continue to cause waterlogging. While no desilting occurred in 2024/2025, 53.78 chains of new drains were dug in P21A and PR25B. Weeding showed slight improvement, but mixed cover with seeding weeds persists. <span class='observation-ref'>(PA 1/2026 Pg. 19; AR 1/2026 Pg. 5, 33-38)</span>",
                    "<b>Manuring Program Delays:</b> The 2026 manuring program is only 50% complete by July, as the estate focused on finishing the 2025 carry-forward program. Wet floor conditions in the fertilizer store also remain an unresolved issue. <span class='observation-ref'>(PA 1/2026 Pg. 22; AR 1/2026 Pg. 20-22)</span>",
                    "<b>Pests & Nursery Disease:</b> Rhinoceros beetle attacks are significant in PR25B, currently treated with Cypermethrin. A Curvularia outbreak severely affected main nursery seedlings, though they are now recovering with a revised fungicide rotation. Rat damage is under control (1-4%). <span class='observation-ref'>(AR 1/2026 Pg. 13-14, 40-42, 49-50)</span>",
                    "<b>Harvesting & Crop Recovery:</b> Harvesting intervals are acceptable at 12-18 days. Crop recovery has visibly improved, with reduced uncollected loose fruits and rotten bunches, though some incidence of overripe bunches still requires continuous monitoring. <span class='observation-ref'>(PA 1/2026 Pg. 32; AR 1/2026 Pg. 25-29)</span>"
                ],
                "reports": {
                    "plantation": { 
                        "Executive Summary": "The overall estate performance is acceptable. FFB yield over 5 months is 5.72 MT/ha (16% below budget), and the cost of production is RM 266.08/MT (7% below budget). The estate needs to persuade contractors to commit to providing sufficient harvesters to keep intervals <15 days and optimize crop recovery. (PA Report, Pg. 48-51)",
                        "Area Statement": "As of May 2026, the total planted area is <b>1,543.38 ha</b>. This comprises: <br>• <b>Mature:</b> 1,208.76 ha (78%). <br>• <b>Immature:</b> 334.62 ha (22% - P23B, P24B, P25B). <br>• <b>Replanting:</b> Next replanting scheduled for 2027 in P98C (183 ha). (PA Report, Pg. 10)",
                        "Labour Statement": "Current workforce is 91 workers vs. requirement of 97 (Ratio 1:17 ha). <br>• <b>Harvesters:</b> 49 (Deficit of 6). Ratio 1:25 ha is insufficient for tall palms/progressive pruning. <br>• <b>Drivers/Loaders:</b> 3 (Deficit of 3). <br>• <b>Weeding:</b> 15 (Deficit of 1). (PA Report, Pg. 14)",
                        "Staff Establishment": "The staff establishment is sufficient with 13 personnel. Includes 1 Manager, 2 Junior Asst Managers (En. Irawanbudiyasa promoted Jan 2026), 1 Sustainability Officer, and 7 Field Conductors (2 joined Feb/Mar 2026). (PA Report, Pg. 13)",
                        "General Charges": "Total General Charges are <b>RM 439.60/ha</b> (YTD April), which is 12% below the budget of RM 501.53. <br>• <b>Overspending:</b> 'Bonus' (+82%), 'Salaries' (+15%), 'Paid Leave' (+26%), 'Electricity' (+29%). <br>• <b>Savings:</b> Offset by lower spending in recruitment, welfare, and other administrative headers. (PA Report, Pg. 16-17)",
                        "Upkeep and Cultivation": "• <b>Weeding:</b> Circle spraying 82% complete (delayed in flooded areas). Selective spraying 89% complete. Cost is RM 75.81/ha (4% below budget). <br>• <b>Manuring:</b> 54% of 1st half program completed (346.10 MT applied). Delayed due to delivery issues. <br>• <b>Pest & Disease:</b> Rat attack under control (<10%). Barn owl occupancy is very low (6%) with 143/155 nests damaged. Ganoderma mortality >5% in tall palms. (PA Report, Pg. 18-24)",
                        "Harvesting and Collection": "YTD Cost is <b>RM 76.28/MT</b>, slightly higher than the annual budget of RM 74.30. <br>• <b>Interval:</b> Ranging from 14 to 17 days. Needs to be kept <15 days. <br>• <b>Mechanization:</b> 9 Mechanical Buffaloes assisting 49 harvesters. Machine prod: 9.0 MT/day. <br>• <b>Standard:</b> Acceptable FFB quality and loose fruit recovery, though unpruned fronds in flooded areas are messy. (PA Report, Pg. 32-33, 46)",
                        "Crop Production": "YTD (5 Months) FFB Production is <b>6,569.39 MT</b>, which is 16% below the budget of 7,831.04 MT. <br>• <b>Yield/Ha:</b> 5.72 MT/ha (5 months). <br>• <b>Observation:</b> Better than the same period last year, but harvesters need to be maximized to reach targets. (PA Report, Pg. 34)",
                        "Production Cost": "YTD Cost of Production is <b>RM 266.08/MT</b>, which is 7% favorable compared to the budget of RM 286.48/MT. <br>• <b>General Charges:</b> RM 98.36/MT (-4%) <br>• <b>Upkeep:</b> RM 91.44/MT (In line) <br>• <b>Harvesting:</b> RM 76.28/MT (-17% vs YTD budget). (PA Report, Pg. 35)",
                        "Vehicles Running Cost": "Vehicles are in good condition except for the Tractor Landini DT90 which is broken down (evaluating for major repair or write-off). Estate advised to initiate vehicle running record system. (PA Report, Pg. 47)",
                        "Capital Expenditure": "N/A (Routine maintenance and lateriting budgets planned for soggy roads in low-lying areas). (PA Report, Pg. 27)",
                        "Immature": "• <b>P23B (74.80 ha):</b> 30 months old. Basal pruning & scout harvesting started. Cost to maturity: RM 13,569/ha. <br>• <b>P24B (150.57 ha):</b> 16 months old. Ablation started April. Oryctes beetle attacks observed. <br>• <b>P25B (109.25 ha):</b> Planting completed on cambered bunds. Supply/infill of vacant points in progress. (PA Report, Pg. 36-40)"
                    },
                    "agronomy": { 
                        "Executive Summary": "The July 2026 visit highlighted a decline in yield to 15.37 MT/ha in 2025 and 6.93 MT/ha for Jan-Jun 2026. The major constraint is the unbalanced age profile with 42% over 26 years old and 0% prime palms. High Ganoderma incidence is a critical issue, but no census has been conducted. Field operations like crop recovery and pruning have improved, but weeding and manuring timeliness need significant attention. (Source: AR 1/2026, Pg. 4-6, 51-54)",
                        "Nutrient Inputs/Progress of Manuring": "The 2026 manuring program is only 50% complete by July 2026, delayed due to the estate prioritizing the completion of the carry-forward 2025 program. Wet floor conditions in the fertilizer store remain an unresolved issue. EFB mulching was carried out in P24B at 49.92 MT/ha. (Source: AR 1/2026, Pg. 20-24)",
                        "Agronomic Observation": "Harvesting intervals are acceptable (12-18 days) and crop recovery has noticeably improved, despite some overripe bunches persisting. Pruning is largely satisfactory with minimal dry hanging fronds. Weeding is slightly improved but mixed with seeding weeds. Rhinoceros beetle attacks were noted in PR25B, and a Curvularia outbreak occurred in the main nursery. (Source: AR 1/2026, Pg. 25-50)",
                        "Yield Performance": "Yield for Jan-Jun 2026 was 6.93 MT/ha, lower than the 7.37 MT/ha achieved in the same period of 2025. This was driven by a 6.4% drop in average bunch weight and fewer bunches per palm across most sub-blocks. The 2025 full-year yield was 15.37 MT/ha. (Source: AR 1/2026, Pg. 51-54)",
                        "Fertilizer Recommendation": "For new planting or supply in 2026, 600g CRF and 500g RP per hole is recommended. The estate must minimize gaps between the scheduled and actual application, and any delayed 2026 fertilizer program must not be carried past January 2027. (Source: AR 1/2026, Pg. 55)"
                    },
                    "pinfosys": {
                        "CEO Financial Summary": "N/A",
                        "Summary of Oil Palm Expenditure": "N/A"
                    }
                }
            };

            let chartInstances = {};
            const container = document.getElementById('selected-estate-container');

            function renderEstate() {
                container.innerHTML = createEstateHTML(estateData);
                setTimeout(() => {
                    initializeChartsForEstate();
                    populateInternalDropdowns();
                    attachEventListeners();
                }, 0);
            }

            function createEstateHTML(estate) {
                const summaryMetricsHTML = Object.values(estate.summaryMetrics).map(metric => {
                    const colorClass = metric.title.includes('Area') ? 'bg-blue-50 text-blue-800' : 
                                       metric.title.includes('Yield') ? 'bg-green-50 text-green-800' :
                                       metric.title.includes('Cost') ? 'bg-orange-50 text-orange-800' :
                                       metric.title.includes('Ganoderma') ? 'bg-red-50 text-red-800' : 'bg-purple-50 text-purple-800';
                    
                    if (metric.type === 'chart') {
                        return `<div class="p-4 rounded-lg ${colorClass} flex flex-col justify-between"><h3 class="font-semibold">${metric.title}</h3><div class="h-32 w-full mt-2 relative"><canvas id="${metric.canvasId}"></canvas></div><p class="text-xs text-gray-500 mt-2 text-center font-medium">${metric.note}</p></div>`;
                    }
                    if (metric.lines) {
                        return `<div class="p-4 rounded-lg ${colorClass}"><h3 class="font-semibold mb-2">${metric.title}</h3>${metric.lines.map(line => `<p class="text-sm leading-relaxed">${line}</p>`).join('')}</div>`;
                    }
                    return `<div class="p-4 rounded-lg ${colorClass}"><h3 class="font-semibold">${metric.title}</h3><p class="text-2xl font-bold mt-1">${metric.value}</p><p class="text-xs text-gray-600 mt-2 font-medium">${metric.note}</p></div>`;
                }).join('');

                const keyMetricsHTML = estate.keyMetrics.map(metric => `
                    <div class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border border-gray-100">
                        <div class="bg-white p-2 rounded-full shadow-sm">${metric.icon}</div>
                        <div><p class="text-xs text-gray-500 uppercase tracking-wider font-semibold">${metric.label}</p><p class="font-bold text-gray-900">${metric.value}</p></div>
                    </div>`).join('');

                const observationsHTML = estate.observations.map(obs => `<li class="ml-4 pl-1">${obs}</li>`).join('');

                return `
                    <div class="bg-white p-6 rounded-lg shadow-lg animate-fade-in border-t-4 border-green-800">
                        <h2 class="text-3xl font-bold mb-2 text-gray-900">${estate.name}</h2>
                        <p class="text-sm text-gray-500 mb-6 italic bg-gray-50 p-2 rounded inline-block border border-gray-200">${estate.reportInfo}</p>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 mb-8">
                            ${summaryMetricsHTML}
                        </div>
                        
                        <div class="mb-8">
                            <h3 class="text-xl font-bold mb-4 border-b pb-2 text-gray-800">Key Metrics & Agronomic Status</h3>
                            <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-4">${keyMetricsHTML}</div>
                        </div>
                        
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8 bg-gray-50 p-4 rounded-lg border border-gray-100">
                            <div class="bg-white p-4 rounded shadow-sm">
                                <h3 class="text-lg font-bold mb-4 text-center text-gray-800">Historical FFB Performance</h3>
                                <div class="chart-container"><canvas id="prodChart-${estate.id}"></canvas></div>
                                <p class="text-xs text-center text-gray-500 mt-3">${estate.chartData.production.note}</p>
                            </div>
                            <div class="bg-white p-4 rounded shadow-sm">
                                <h3 class="text-lg font-bold mb-4 text-center text-gray-800">Palm Age Profile</h3>
                                <div class="pie-chart-container"><canvas id="ageChart-${estate.id}"></canvas></div>
                                <p class="text-xs text-center text-gray-500 mt-3">${estate.chartData.ageProfile.note}</p>
                            </div>
                        </div>
                        
                        <div class="mb-8 bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
                            <h3 class="text-xl font-bold mb-4 border-b pb-2 text-gray-800">Key Observations & Issues</h3>
                            <ul class="list-disc list-outside space-y-3 text-gray-700 ml-4">${observationsHTML}</ul>
                        </div>
                        
                        <div class="mb-8 text-center">
                            <button class="policy-modal-btn bg-green-800 text-white px-8 py-3 rounded-lg hover:bg-green-900 transition shadow-md font-semibold tracking-wide">
                                View Agricultural Policy Cross-Reference
                            </button>
                        </div>
                        
                        <div class="space-y-3">
                            <button data-dropdown-id="${estate.id}-plantation" class="dropdown-btn w-full text-left bg-gray-800 text-white p-4 rounded-md hover:bg-gray-700 transition font-semibold text-lg flex justify-between items-center">
                                <span>Plantation Advisory Report Details</span>
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                            </button>
                            <div id="${estate.id}-plantation" class="details-content bg-gray-50 p-6 rounded-md border border-gray-200 shadow-inner"></div>
                            
                            <button data-dropdown-id="${estate.id}-agronomy" class="dropdown-btn w-full text-left bg-gray-800 text-white p-4 rounded-md hover:bg-gray-700 transition font-semibold text-lg flex justify-between items-center">
                                <span>Agronomy Report Details</span>
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                            </button>
                            <div id="${estate.id}-agronomy" class="details-content bg-gray-50 p-6 rounded-md border border-gray-200 shadow-inner"></div>
                            
                            <button data-dropdown-id="${estate.id}-pinfosys" class="dropdown-btn w-full text-left bg-gray-800 text-white p-4 rounded-md hover:bg-gray-700 transition font-semibold text-lg flex justify-between items-center">
                                <span>Pinfosys Report Details</span>
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                            </button>
                            <div id="${estate.id}-pinfosys" class="details-content bg-gray-50 p-6 rounded-md border border-gray-200 shadow-inner"></div>
                        </div>
                    </div>`;
            }

            function initializeChartsForEstate() {
                const prodCanvasId = `prodChart-${estateData.id}`;
                const ageCanvasId = `ageChart-${estateData.id}`;
                
                if (chartInstances[prodCanvasId]) chartInstances[prodCanvasId].destroy();
                if (chartInstances[ageCanvasId]) chartInstances[ageCanvasId].destroy();
                if (chartInstances['miniYieldChart']) chartInstances['miniYieldChart'].destroy();

                // 1. Mini Yield Bar Chart
                const miniYieldCtx = document.getElementById('miniYieldChart')?.getContext('2d');
                if (miniYieldCtx) {
                    chartInstances['miniYieldChart'] = new Chart(miniYieldCtx, {
                        type: 'bar',
                        data: {
                            labels: ['2024', '2025', '2026'],
                            datasets: [
                                {
                                    label: 'Actual',
                                    data: [17.35, 15.37, 6.93],
                                    backgroundColor: '#16a34a',
                                    borderRadius: 4,
                                    barPercentage: 0.6
                                },
                                {
                                    label: 'Budget',
                                    data: [null, null, 8.17], // Estimated 6mo budget based on PA 5mo run-rate
                                    backgroundColor: '#9ca3af',
                                    borderRadius: 4,
                                    barPercentage: 0.6
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            layout: {
                                padding: {
                                    top: 25
                                }
                            },
                            scales: {
                                x: { grid: { display: false }, ticks: { font: { size: 10, weight: 'bold' } } },
                                y: { display: false, beginAtZero: true }
                            },
                            plugins: {
                                legend: { 
                                    display: true, 
                                    position: 'bottom', 
                                    labels: { boxWidth: 10, font: { size: 10, weight: '500' } } 
                                },
                                datalabels: {
                                    anchor: 'end',
                                    align: 'top',
                                    color: '#4b5563',
                                    font: { weight: 'bold', size: 11 },
                                    formatter: function(value) {
                                        return value ? value : '';
                                    }
                                }
                            }
                        }
                    });
                }

                // 2. Main Production Line Chart
                const prodCtx = document.getElementById(prodCanvasId)?.getContext('2d');
                if(prodCtx) {
                    chartInstances[prodCanvasId] = new Chart(prodCtx, {
                        type: 'line',
                        data: {
                            labels: estateData.chartData.production.labels,
                            datasets: [{ 
                                label: 'FFB Yield (MT/Ha)', 
                                data: estateData.chartData.production.ffb, 
                                borderColor: '#166534',
                                backgroundColor: 'rgba(22, 101, 52, 0.1)',
                                fill: true,
                                tension: 0.3,
                                pointBackgroundColor: '#166534',
                                pointRadius: 4,
                                pointHoverRadius: 6
                            }]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            scales: { 
                                y: { beginAtZero: false, title: { display: true, text: 'MT/Ha', font: {weight: 'bold'} } },
                                x: { grid: { display: false } }
                            },
                            plugins: {
                                datalabels: { display: false } // Disable DataLabels here
                            }
                        }
                    });
                }

                // 3. Palm Age Pie Chart
                const ageCtx = document.getElementById(ageCanvasId)?.getContext('2d');
                if(ageCtx) {
                    chartInstances[ageCanvasId] = new Chart(ageCtx, {
                        type: 'pie',
                        data: {
                            labels: estateData.chartData.ageProfile.labels,
                            datasets: [{ 
                                data: estateData.chartData.ageProfile.data, 
                                backgroundColor: ['#fde047', '#facc15', '#a3a3a3', '#ca8a04', '#a16207'], 
                                hoverOffset: 6,
                                borderWidth: 2,
                                borderColor: '#fff'
                            }]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            plugins: { 
                                title: { display: true, text: estateData.chartData.ageProfile.title, font: {size: 14} }, 
                                legend: { position: 'bottom', labels: { boxWidth: 12 } },
                                datalabels: { display: false } // Disable DataLabels here
                            } 
                        }
                    });
                }
            }
            
            function populateInternalDropdowns() {
                const agronomyDiv = document.getElementById(`${estateData.id}-agronomy`);
                const plantationDiv = document.getElementById(`${estateData.id}-plantation`);
                const pinfosysDiv = document.getElementById(`${estateData.id}-pinfosys`);

                if (agronomyDiv && estateData.reports.agronomy) {
                    agronomyDiv.innerHTML = Object.entries(estateData.reports.agronomy).map(([section, content]) => `
                        <div class="mb-4 last:mb-0">
                            <h4 class="font-bold text-gray-900 border-l-4 border-green-700 pl-2 mb-1">${section.replace(/([A-Z])/g, ' $1').trim()}:</h4>
                            <p class="text-sm text-gray-700 leading-relaxed pl-3">${content}</p>
                        </div>`).join('');
                } else if (agronomyDiv) {
                     agronomyDiv.innerHTML = `<p class="text-sm text-gray-600 italic">Not Available</p>`;
                }
                
                if (plantationDiv && estateData.reports.plantation) {
                    plantationDiv.innerHTML = Object.entries(estateData.reports.plantation).map(([section, content]) => `
                        <div class="mb-4 last:mb-0">
                            <h4 class="font-bold text-gray-900 border-l-4 border-green-700 pl-2 mb-1">${section.replace(/([A-Z])/g, ' $1').trim()}:</h4>
                            <p class="text-sm text-gray-700 leading-relaxed pl-3">${content}</p>
                        </div>`).join('');
                } else if (plantationDiv) {
                     plantationDiv.innerHTML = `<p class="text-sm text-gray-600 italic">Not Available</p>`;
                }
                
                 if (pinfosysDiv) {
                    if(estateData.reports.pinfosys && Object.values(estateData.reports.pinfosys).some(val => val !== "N/A")) {
                        pinfosysDiv.innerHTML = Object.entries(estateData.reports.pinfosys).map(([section, content]) => `
                        <div class="mb-4 last:mb-0">
                            <h4 class="font-bold text-gray-900 border-l-4 border-green-700 pl-2 mb-1">${section.replace(/([A-Z])/g, ' $1').trim()}:</h4>
                            <p class="text-sm text-gray-700 leading-relaxed pl-3">${content}</p>
                        </div>`).join('');
                    } else {
                        pinfosysDiv.innerHTML = `<p class="text-sm text-gray-600 italic">Financial data currently not available.</p>`;
                    }
                }
            }

            function attachEventListeners() {
                container.querySelectorAll('.dropdown-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const id = event.currentTarget.dataset.dropdownId;
                        const content = document.getElementById(id);
                        const allContents = container.querySelectorAll('.details-content');
                        const allButtons = container.querySelectorAll('.dropdown-btn');
                        
                        if (content.classList.contains('active')) {
                             content.classList.remove('active');
                             event.currentTarget.classList.remove('active');
                             event.currentTarget.querySelector('svg').style.transform = 'rotate(0deg)';
                             return;
                        }

                        allContents.forEach(c => { c.classList.remove('active'); });
                        allButtons.forEach(b => { 
                            b.classList.remove('active'); 
                            if(b.querySelector('svg')) b.querySelector('svg').style.transform = 'rotate(0deg)';
                        });

                        content.classList.add('active');
                        event.currentTarget.classList.add('active');
                        event.currentTarget.querySelector('svg').style.transform = 'rotate(180deg)';
                    });
                });
                container.querySelector('.policy-modal-btn')?.addEventListener('click', openPolicyModal);
            }

            renderEstate();
        });
        
        function openPolicyModal() {
            const modal = document.getElementById('policyModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            const policyData = `
                <div class='policy-item'>
                    <p class='font-semibold'>Ganoderma Control</p>
                    <p class='text-sm text-gray-600'><b>Policy Ref: P&D-Gano-01:</b> Strict sanitation (de-boling) of infected stands is mandatory. For replanting in infected areas, conduct a census to determine infection severity. Mounding is not recommended for palms >20 years.</p>
                </div>
                <div class='policy-item'>
                    <p class='font-semibold'>Drainage Management</p>
                    <p class='text-sm text-gray-600'><b>Policy Ref: SOIL-DRAIN-02:</b> In areas with high silt subsoil (e.g., P21A, P23B, PR25B), regular de-silting and maintenance of drainage intensity are critical to prevent waterlogging.</p>
                </div>
                 <div class='policy-item'>
                    <p class='font-semibold'>Fertilizer Management</p>
                    <p class='text-sm text-gray-600'><b>Policy Ref: FERT-STORE-03:</b> Fertilizers must be stored on pallets to prevent moisture absorption and caking. Wet floor conditions in storage must be rectified immediately (e.g., peripheral drains).</p>
                </div>
                 <div class='policy-item'>
                    <p class='font-semibold'>Manuring Schedule</p>
                    <p class='text-sm text-gray-600'><b>Policy Area:</b> Carry-forward fertilizer programs must not extend past January of the following year to avoid overlapping and leaching during monsoon seasons.</p>
                </div>
                 <div class='policy-item'>
                    <p class='font-semibold'>Crop Recovery & Harvesting</p>
                    <p class='text-sm text-gray-600'><b>Policy Area:</b> Standards for loose fruit collection, overripe bunch prevention, and minimising field losses must be strictly enforced to maximise yield, especially given the unfavourable age profile.</p>
                </div>
            `;
            modalTitle.innerText = `Agricultural Policy Areas: Ladang Cheekah Kemayan`;
            modalContent.innerHTML = policyData;
            modal.classList.add('active');
        }

        function closePolicyModal() {
            document.getElementById('policyModal').classList.remove('active');
        }
    </script>
</body>
</html>
