<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ladang Sungai Beranang - Plantation and Agronomy Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .details-content { display: none; }
        .details-content.active { display: block; }
        .dropdown-btn.active { background-color: #14532d; }
        .policy-item { border-left: 3px solid #16a34a; padding-left: 1rem; margin-top: 0.75rem; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .chart-container { position: relative; height: 300px; width: 100%; margin: auto; }
        .pie-chart-container { position: relative; height: 350px; width: 100%; margin: auto; }
        .observation-ref { font-size: 0.75rem; color: #57534e; font-style: italic; }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <div class="text-xl font-bold text-gray-900">
                <a href="index.html" class="flex items-center">
                    Ladang Sungai Beranang Report
                </a>
            </div>
            <a href="estates.html" class="text-green-800 hover:text-green-900 transition duration-300">&larr; Back to Estates List</a>
        </nav>
    </header>

    <div class="container mx-auto p-4 md:p-8">
        <div id="selected-estate-container" class="grid grid-cols-1 gap-8">
             <!-- Content will be generated by JavaScript -->
        </div>
    </div>
    
    <div id="policyModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-2xl font-bold">Agricultural Policy Cross-Reference</h3>
                <button onclick="closePolicyModal()" class="text-gray-500 hover:text-gray-800 text-2xl font-bold">&times;</button>
            </div>
            <div id="modalContent" class="space-y-4 overflow-y-auto pr-4 flex-grow">
                <!-- Policy content populated by JS -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const estateData = {
                "id": "sungaiberanang",
                "name": "Ladang Sungai Beranang",
                "reportInfo": "Data based on Agronomy Report 1/2026 (Visit: 25th June 2026) & Plantation Advisory Report 1/2026 (Visit: 20th Feb 2026).",
                "summaryMetrics": {
                    "area": {
                        "title": "Estate Area",
                        "lines": [
                            "Total Estate: 442.72 ha",
                            "Oil Palm (Total): 324.88 ha",
                            "Rubber (Total): 104.15 ha",
                            "Empty/Phase 3: 13.69 ha"
                        ]
                    },
                    "yield": {
                        "title": "Yield/Ha (1H 2026 vs 1H 2025)",
                        "value": "8.20 MT/Ha vs 7.97 MT/Ha",
                        "note": "First Half 2026 (-2.8% vs 2025)"
                    },
                    "cost": {
                        "title": "Manual Loading",
                        "value": "RM 8.00/t",
                        "note": "Avg Earning RM 80/day (PA)"
                    },
                    "weeding": {
                        "title": "Weeding Progress",
                        "value": "Behind Schedule",
                        "note": "Only 1 round inter-row in P01, P04, P05"
                    },
                    "manuring": {
                        "title": "Manuring Status (2026)",
                        "value": "15% OP / 0% Rubber",
                        "note": "Delayed due to labour shortage"
                    }
                },
                "keyMetrics": [
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-red-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z' /></svg>", "label": "Harvester Strength", "value": "10 Available (-9)", "note": "Ratio 1:27 ha (Target 1:14)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-yellow-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z' /></svg>", "label": "P&D Status", "value": "Ganoderma Active, Rats", "note": "Deboling ongoing; Mild rat damage" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-red-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' /></svg>", "label": "Harvest Interval", "value": ">20 Days in P97/P99", "note": "Extreme delay, severe crop loss in ravines" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-green-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2' /></svg>", "label": "Rubber Status", "value": "591 Kg/Ha", "note": "Latex overflow due to biweekly collection" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-blue-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10' /></svg>", "label": "Replanting 2026", "value": "P97 & P99", "note": "On hold due to diesel price hike" }
                ],
                "chartData": {
                    "production": {
                        "labels": ["P97", "P99", "P01", "P04", "P05", "P13", "P18 (Avg)"],
                        "yield2025": [2.95, 3.04, 11.73, 10.14, 10.84, 5.26, 11.41],
                        "yield2024": [6.08, 5.89, 9.12, 9.55, 8.87, 6.74, 11.11], // 2024 represents the comparison period 2025 in the new report
                        "note": "*FFB Yield (t/ha) Comparison Jan-Jun 2026 vs Jan-Jun 2025. Severe drop in P97 & P99."
                    },
                    "ageProfile": {
                        "labels": ["Immature (0-3)", "Young Mature (4-7)", "Prime (8-19)", "Old (20-25)", "Very Old (>26)"],
                        "data": [8.5, 8.3, 26.8, 32.3, 24.2],
                        "title": "Oil Palm Age Profile (%)",
                        "note": "*High percentage of old palms (>20 years) due for replanting."
                    }
                },
                "observations": [
                    "<b>Chronic Labour Shortage & Turnover:</b> The estate faces a critical shortage of 14 workers in Oil Palm (10 vs 19 needed). This remains the root cause for massive delays in harvesting, weeding, and manuring. <span class='observation-ref'>(PA Report 1/2026, Pg. 11-12; Agronomy 1/2026, Pg. 18)</span>",
                    "<b>Extreme Harvesting Delays & Crop Loss:</b> Harvesting intervals exceeded 20 days in P97 and P99 ravines. Direct crop losses are evident due to steep terrain, under-pruning, and uncollected rotten/loose fruits on collection platforms. <span class='observation-ref'>(Agronomy 1/2026, Pg. 20-25)</span>",
                    "<b>Severe Manuring & Weeding Backlogs:</b> The 2026 manuring program is only 15% complete for OP and 0% for Rubber. Weeding is behind schedule, with P97/P99 overgrown and cattle intrusion damaging fronds in immature PR21B. <span class='observation-ref'>(Agronomy 1/2026, Pg. 16, 34-36, 46)</span>",
                    "<b>Ganoderma & Pests:</b> Active Ganoderma detected in P01 and P05 requiring proper census and deboling. Mild rat damage noted across fields; half-yearly baiting without replacement is recommended. <span class='observation-ref'>(Agronomy 1/2026, Pg. 38-39)</span>",
                    "<b>Rubber Tapping & Collection Issues:</b> Latex overflow is occurring in R14 due to a biweekly collection schedule (must be weekly). Deep tapping injuries are prevalent in R06 & R07. R14 yield reported an unverified 231% spike. <span class='observation-ref'>(Agronomy 1/2026, Pg. 51-54, 63)</span>",
                    "<b>Replanting Put On Hold:</b> P97 and P99 are scheduled for 2026 replanting. Land preparation commenced in March but was halted due to the hike in diesel prices, leaving older palms neglected. <span class='observation-ref'>(Agronomy 1/2026, Pg. 11, 20)</span>"
                ],
                "reports": {
                    "plantation": { 
                        "Executive Summary": "The main issue is the prolonged labour shortage and high worker turnover disrupting schedules. Work quality has declined as work is often rushed. Adequate recruitment is vital as more areas move to maturity. (PA Report 1/2026, Pg. 7, 48)",
                        "Area Statement": "Total Hectarage: 517.02 ha. <br>• <b>Mature OP:</b> 270.53 ha <br>• <b>Immature OP:</b> 54.35 ha <br>• <b>Replanting:</b> P97A & P99B (78.51 ha) scheduled for 2026 replant; felling expected April/May. (PA Report 1/2026, Pg. 9-10)",
                        "Labour Statement": "<b>Oil Palm:</b> Short 14 workers (10 Harvesters vs 19 required). Harvester ratio is 1:27 ha (Target 1:14 ha). <br><b>Rubber:</b> Short 5 tappers (11 vs 16 required). (PA Report 1/2026, Pg. 11-12)",
                        "Staff Establishment": "Satisfactory. 6 personnel total, including Sr Asst In-Charge (Mr. Muruganathan), Asst Manager (Mr. Muhamad Hafiz), and Jr Asst Manager (Mr. Kogulan). (PA Report 1/2026, Pg. 13)",
                        "General Charges": "Road grading budgeted at RM10/chain; actual paid RM10/chain. Grader contractor stopped due to low rates; backhoe loader now used for patching. (PA Report 1/2026, Pg. 30)",
                        "Upkeep & Cultivation": "• <b>Circle Spraying:</b> 53% complete (shortage). Output 3.9 ha/md. <br>• <b>Selective Spraying:</b> 76% complete. VOPs, Lalang, and Asystasia still present. <br>• <b>Manuring:</b> OP output low at 20 bags/md. (PA Report 1/2026, Pg. 14-25)",
                        "Harvesting and Collection": "Average interval is 23 days. Shortage of harvesters remains the primary yield resistance. 1 Badang unit used with 3 cutters/1 collector. (PA Report 1/2026, Pg. 34-35)",
                        "Crop Production": "Full year 2025 yield: 18.07 t/ha (3% below budget of 18.61 t/ha). 19 harvesting rounds achieved vs 24 budgeted. Rubber yield: 611 kg/ha (38% below budget). (PA Report 1/2026, Pg. 34, 37)",
                        "Production Cost": "Manual loading earning averages RM80. Piece rate for manuring RM2.40/bag. Harvesting rate for 2001-2005 plantings is RM37.00/ton. (PA Report 1/2026, Pg. 35, 24)",
                        "Vehicles Running Cost": "Backhoe hired for 1186 hours at RM50/hour (Total RM 59,300). Road grading completed only 193.97 chains vs 1200 chains budgeted. (PA Report 1/2026, Pg. 30)",
                        "Capital Expenditure": "N/A. Minor road repairs performed using hired backhoe loader. (PA Report 1/2026, Pg. 30)",
                        "Immature": "• <b>R21 (Rubber):</b> Growth uneven due to 3300 supplies in 2025. Side shoots need pruning. <br>• <b>PR23 (OP):</b> Palms appear satisfactory; good fruit sets. 150 supplies pending. <br>• <b>PR21/H:</b> Basal pruning 15 ha complete. (PA Report 1/2026, Pg. 40-47)"
                    },
                    "agronomy": { 
                        "Executive Summary": "Agronomic conditions remain below satisfactory due to widespread delays in major programs (manuring, weeding, pruning) driven by labor shortages. Harvesting delays persist in older blocks (P97/P99), causing severe crop losses in ravines. Rubber recovery is hampered by latex overflow from delayed collection and poor tapping quality. Immediate corrective actions are necessary. (Agronomy Report 1/2026, Pg. 64)",
                        "Nutrient Inputs/Progress of Manuring": "Progress is severely delayed. As of June 2026, Oil Palm manuring is only 15% completed (50.27 MT Mixture B applied), and Rubber is 0% completed. Outstanding programs scheduled between January and May 2026 remain unattended. The estate must expedite this to prevent stunted palm growth. (Agronomy Report 1/2026, Pg. 16-18)",
                        "Agronomic Observation": "<b>Harvesting:</b> Intervals >20 days in P97 & P99 ravines causing rotten bunches and severe crop loss. Over-ripe and oxidized loose fruits found uncollected in P01/P05.<br><br><b>Vegetation/Weeding:</b> Behind schedule. Only one round of inter-row weeding done in P01, P04, P05. Cattle intrusion spotted in immature PR21B damaging fronds.<br><br><b>Canopy Management:</b> Pruning pending in P97/P99. P01/P05 are up to date. Backlog clearing ongoing in P04/P13.<br><br><b>Pests & Disease:</b> Ganoderma active in P01/P05. Mild rat damage (half-yearly baiting recommended).<br><br><b>Rubber:</b> Latex overflow in R14 due to biweekly (instead of weekly) collection. Deep tapping injuries in R06/R07. (Agronomy Report 1/2026, Pg. 20-54)",
                        "Yield Performance": "Total Oil Palm yield for Jan-Jun 2026 was 8.20 MT/ha (-2.8% vs 2025). Severe yield drops observed in P97 (2.95 MT/ha) and P99 (3.04 MT/ha). Rubber yield was recorded at 591 kg/ha (+91.3%), heavily driven by an unverified 231% spike in R14, while yields in R06 and R07 actually declined. Estate must recheck R14 yield calculations. (Agronomy Report 1/2026, Pg. 60-63)",
                        "Fertilizer Recommendation": "The 2026 program has been revised. Mature OP blocks (P04, P05, P13) require Mixture B, RP, and KIE. P01 requires NK1. Replanting areas (P97/P99) require CRF 600g & RP 500g in planting holes during transplanting. Immature fields (PR21B, PR23C) require Mixture B, KIE, and RP. (Agronomy Report 1/2026, Pg. 65-68)"
                    },
                    "pinfosys": "Not Available"
                },
                "policy": "<div class='policy-item'><p class='font-semibold'>Manuring Schedule Compliance</p><p class='text-sm text-gray-600'><b>Policy Ref: FERT-APP-05:</b> Fertilizer applications must follow the schedule strictly. Delays >15 days require a mitigation report.</p></div><div class='policy-item'><p class='font-semibold'>Harvesting Intervals</p><p class='text-sm text-gray-600'><b>Policy Ref: HARV-INT-01:</b> Harvesting intervals must not exceed 15 days to prevent loose fruit accumulation and crop loss.</p></div><div class='policy-item'><p class='font-semibold'>Rubber Tapping & Collection</p><p class='text-sm text-gray-600'><b>Policy Ref: RUB-TAP-03:</b> Latex collection must be conducted at least weekly to avoid overflow and sap hardening in the collection cups.</p></div>"
            };

            let chartInstances = {};
            const container = document.getElementById('selected-estate-container');

            function renderEstate() {
                container.innerHTML = createEstateHTML(estateData);
                setTimeout(() => {
                    initializeChartsForEstate();
                    populateInternalDropdowns();
                    attachEventListeners();
                }, 0);
            }

            function createEstateHTML(estate) {
                const summaryMetricsHTML = Object.values(estate.summaryMetrics).map(metric => {
                    const colorClass = metric.title.includes('Area') ? 'bg-blue-50 text-blue-800' : 
                                       metric.title.includes('Yield') ? 'bg-green-50 text-green-800' :
                                       metric.title.includes('Cost') || metric.title.includes('Manual') ? 'bg-orange-50 text-orange-800' :
                                       metric.title.includes('Weeding') || metric.title.includes('Status') ? 'bg-red-50 text-red-800' : 'bg-yellow-50 text-yellow-800';
                    let content;
                    if (metric.lines) {
                        content = metric.lines.map(line => `<p class="text-sm">${line}</p>`).join('');
                    } else {
                        content = `<p class="text-2xl font-bold">${metric.value}</p><p class="text-xs text-gray-500 mt-1">${metric.note}</p>`;
                    }
                    return `<div class="p-4 rounded-lg ${colorClass} shadow-sm">
                                <h3 class="font-semibold text-sm mb-1">${metric.title}</h3>
                                ${content}
                            </div>`;
                }).join('');

                const keyMetricsHTML = estate.keyMetrics.map(metric => `
                    <div class="bg-gray-50 p-3 rounded-lg flex items-start space-x-4 border border-gray-100">
                        <div class="flex-shrink-0 bg-gray-200 p-2 rounded-full mt-1">
                            ${metric.icon}
                        </div>
                        <div>
                            <p class="text-sm text-gray-500">${metric.label}</p>
                            <p class="font-bold text-lg">${metric.value}</p>
                            ${metric.note ? `<p class="text-xs text-gray-500">${metric.note}</p>` : ''}
                        </div>
                    </div>`).join('');

                return `
                    <div class="bg-white p-6 rounded-lg shadow-lg animate-fade-in">
                        <h2 class="text-3xl font-bold mb-2 text-gray-900">${estate.name}</h2>
                        <p class="text-sm text-gray-500 mb-6 italic">${estate.reportInfo}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 mb-8">${summaryMetricsHTML}</div>
                        <div class="mb-8">
                            <h3 class="text-xl font-semibold mb-4 border-b pb-2">Key Metrics & Agronomic Status</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-4">${keyMetricsHTML}</div>
                        </div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                            <div><h3 class="text-xl font-semibold mb-2">FFB Yield by Block (1H 2026 vs 1H 2025)</h3><div class="chart-container"><canvas id="prodChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.production.note}</p></div>
                            <div><h3 class="text-xl font-semibold mb-2">Palm Age Profile</h3><div class="pie-chart-container"><canvas id="ageChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.ageProfile.note}</p></div>
                        </div>
                        <div class="mb-8"><h3 class="text-xl font-semibold mb-2 border-b pb-2">Key Observations & Issues</h3><ul class="list-disc list-inside space-y-2 text-gray-700 mt-4">${estate.observations.map(obs => `<li class="ml-4">${obs}</li>`).join('')}</ul></div>
                        <div class="mb-8 text-center"><button class="policy-modal-btn bg-green-800 text-white px-6 py-3 rounded-lg hover:bg-green-900 transition shadow-md">View Agricultural Policy Cross-Reference</button></div>
                        <div class="space-y-2">
                            <button data-dropdown-id="${estate.id}-agronomy" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Agronomy Report Details</button>
                            <div id="${estate.id}-agronomy" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                            <button data-dropdown-id="${estate.id}-plantation" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Plantation Advisory Report Details</button>
                            <div id="${estate.id}-plantation" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                            <button data-dropdown-id="${estate.id}-pinfosys" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Pinfosys Report Details</button>
                            <div id="${estate.id}-pinfosys" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                        </div>
                    </div>`;
            }

            function initializeChartsForEstate() {
                const prodCanvasId = `prodChart-${estateData.id}`;
                const ageCanvasId = `ageChart-${estateData.id}`;
                if (chartInstances[prodCanvasId]) chartInstances[prodCanvasId].destroy();
                if (chartInstances[ageCanvasId]) chartInstances[ageCanvasId].destroy();

                const prodCtx = document.getElementById(prodCanvasId)?.getContext('2d');
                if(prodCtx) {
                    chartInstances[prodCanvasId] = new Chart(prodCtx, {
                        type: 'bar',
                        data: {
                            labels: estateData.chartData.production.labels,
                            datasets: [
                                { label: 'Jan-Jun 2026 Yield (t/ha)', data: estateData.chartData.production.yield2025, backgroundColor: '#16a34a' },
                                { label: 'Jan-Jun 2025 Yield (t/ha)', data: estateData.chartData.production.yield2024, backgroundColor: '#bbf7d0' }
                            ]
                        },
                        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, title: { display: true, text: 'Tonnes per Hectare' } } } }
                    });
                }

                const ageCtx = document.getElementById(ageCanvasId)?.getContext('2d');
                if(ageCtx) {
                    chartInstances[ageCanvasId] = new Chart(ageCtx, {
                        type: 'pie',
                        data: {
                            labels: estateData.chartData.ageProfile.labels,
                            datasets: [{ data: estateData.chartData.ageProfile.data, backgroundColor: ['#86efac', '#4ade80', '#22c55e', '#166534', '#14532d'], hoverOffset: 4 }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: estateData.chartData.ageProfile.title, font: { size: 16 } }, legend: { position: 'right' } } }
                    });
                }
            }
            
            function populateInternalDropdowns() {
                const agronomyDiv = document.getElementById(`${estateData.id}-agronomy`);
                const plantationDiv = document.getElementById(`${estateData.id}-plantation`);
                const pinfosysDiv = document.getElementById(`${estateData.id}-pinfosys`);

                if (agronomyDiv && estateData.reports.agronomy) {
                    agronomyDiv.innerHTML = Object.entries(estateData.reports.agronomy).map(([section, content]) => `<h4 class="font-semibold mt-3 text-gray-900">${section}:</h4><p class="text-sm text-gray-600 mt-1">${content}</p>`).join('');
                }
                if (plantationDiv && estateData.reports.plantation) {
                    plantationDiv.innerHTML = Object.entries(estateData.reports.plantation).map(([section, content]) => `<h4 class="font-semibold mt-3 text-gray-900">${section}:</h4><p class="text-sm text-gray-600 mt-1">${content}</p>`).join('');
                }
                if (pinfosysDiv && estateData.reports.pinfosys === "Not Available") {
                    pinfosysDiv.innerHTML = `<p class="text-sm text-gray-600">Not Available</p>`;
                }
            }

            function attachEventListeners() {
                container.querySelectorAll('.dropdown-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const id = event.currentTarget.dataset.dropdownId;
                        const content = document.getElementById(id);
                        content.classList.toggle('active');
                        event.currentTarget.classList.toggle('active');
                    });
                });
                container.querySelector('.policy-modal-btn')?.addEventListener('click', openPolicyModal);
            }

            renderEstate();
        });
        
        function openPolicyModal() {
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            modalTitle.innerText = `Agricultural Policy Cross-Reference: Ladang Sungai Beranang`;
            modalContent.innerHTML = "<div class='policy-item'><p class='font-semibold'>Manuring Schedule Compliance</p><p class='text-sm text-gray-600'><b>Policy Ref: FERT-APP-05:</b> Fertilizer applications must follow the schedule strictly. Delays >15 days require a mitigation report.</p></div><div class='policy-item'><p class='font-semibold'>Harvesting Intervals</p><p class='text-sm text-gray-600'><b>Policy Ref: HARV-INT-01:</b> Harvesting intervals must not exceed 15 days to prevent loose fruit accumulation and crop loss.</p></div><div class='policy-item'><p class='font-semibold'>Rubber Tapping & Collection</p><p class='text-sm text-gray-600'><b>Policy Ref: RUB-TAP-03:</b> Latex collection must be conducted at least weekly to avoid overflow and sap hardening in the collection cups.</p></div>";
            document.getElementById('policyModal').classList.add('active');
        }

        function closePolicyModal() {
            document.getElementById('policyModal').classList.remove('active');
        }
    </script>
</body>
</html>
